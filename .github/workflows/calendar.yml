name: Calendario económico

on:
  schedule:
    - cron: "10 5 * * 1-5"  # 06:10 España en invierno, antes de la rutina
    - cron: "10 18 * * 0"   # domingo por la tarde, para la semana nueva
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_calendar.py data/calendar.json
      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json
          git diff --cached --quiet || (git commit -m "Actualiza el calendario económico" && git push)
